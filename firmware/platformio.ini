; Floetende Kroeten - RFID game mesh firmware
;
; Environments:
;   gateway      - main node: mesh sink + USB serial bridge to the PC server
;   node_points  - game node of type "points" (tap card -> add/subtract points)
;
; Additional node types are added as new environments that set FK_NODE_TYPE
; and compile the same sources (see src/nodes/NodeFactory.cpp).

[platformio]
default_envs = gateway, node_points, node_lookup

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DFK_FW_VERSION=1
    ; radio
    -DFK_CHANNEL=1
    -DFK_LONG_RANGE=1          ; 1 = ESP-NOW long range mode (all devices must match!)
    -DFK_TX_POWER=84           ; quarter dBm, 84 = 21 dBm (max)
    -DFK_MAX_TTL=10
lib_deps =
    bblanchon/ArduinoJson@7.2.1

[env:gateway]
build_src_filter = +<gateway/>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    ${env.build_flags}
    -DFK_ROLE_GATEWAY=1
    ; status light (WS2812, 8 LEDs). Must be an output-capable pin:
    ; GPIO 34-39 are input-only on the ESP32 and cannot drive LEDs.
    -DFK_PIN_BRIDGE_LED=4
    -DFK_BRIDGE_LED_COUNT=8
    -DFK_BRIDGE_LED_BRIGHTNESS=60

[node_common]
build_src_filter = +<node/> +<nodes/>
lib_deps =
    ${env.lib_deps}
    miguelbalboa/MFRC522@1.4.11
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    ${env.build_flags}
    -DFK_ROLE_NODE=1
    ; pins (ESP32 DevKit 38 pin)
    -DFK_PIN_RFID_SS=5
    -DFK_PIN_RFID_RST=22
    -DFK_PIN_LED=4             ; WS2812 data - must be output-capable (not GPIO 34-39)
    -DFK_PIN_BUZZER=25
    -DFK_LED_COUNT=24
    -DFK_LED_MAX_BRIGHTNESS=120  ; hard cap, protects the power supply

[env:node_points]
build_src_filter = ${node_common.build_src_filter}
lib_deps = ${node_common.lib_deps}
lib_ignore = fk_display
build_flags =
    ${node_common.build_flags}
    -DFK_NODE_TYPE=1

; Balance lookup station: RC522 + LED ring + SSD1306 128x64 OLED (I2C)
[env:node_lookup]
build_src_filter = ${node_common.build_src_filter}
lib_deps =
    ${node_common.lib_deps}
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit SSD1306@2.5.13
build_flags =
    ${node_common.build_flags}
    -DFK_NODE_TYPE=2
    -DFK_PIN_OLED_SDA=21
    -DFK_PIN_OLED_SCL=17   ; GPIO 22 is the RC522 reset line
    -DFK_OLED_ADDRESS=0x3C
